<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계획 관리 | 영화 플래너</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/api.js"></script>
  <script defer src="js/plans.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-bar">
      <span class="brand">영화 플래너</span>
      <nav aria-label="주 메뉴">
        <a href="index.html">대화</a>
        <a href="plans.html" aria-current="page">계획 관리</a>
        <a href="logs.html">실행 로그</a>
      </nav>
    </div>
  </header>
  <main class="page">
    <div class="page-heading"><h1>계획 관리</h1></div>
    <p id="plan-status" class="notice" role="status" hidden></p>
    <div class="management-layout">
      <section class="panel" aria-labelledby="plans-heading">
        <div class="section-heading">
          <h2 id="plans-heading">관람 계획</h2>
          <label class="date-filter">관람 날짜 <input type="date" id="filter-date"></label>
        </div>
        <ul id="plan-list" class="record-list" aria-label="관람 계획 목록"></ul>
      </section>
      <div class="stack">
        <section id="plan-detail" class="panel" aria-labelledby="detail-heading" hidden>
          <h2 id="detail-heading">계획 상세</h2>
          <div id="plan-detail-body" aria-live="polite"></div>
        </section>
        <section class="panel" aria-labelledby="add-heading">
          <h2 id="add-heading">새 계획 추가</h2>
          <div id="add-plan"></div>
        </section>
      </div>
    </div>
  </main>
  <template id="plan-form-template">
    <form class="plan-form">
      <label>영화명<input name="movie_nm" required></label>
      <label>관람 날짜<input type="date" name="watch_date" required></label>
      <div class="fields">
        <label>시작 시각<input type="time" name="start_time" required></label>
        <label>종료 시각<input type="time" name="end_time" required></label>
      </div>
      <label>영화관<input name="theater_name"></label>
      <label>영화관 주소<input name="theater_address"></label>
      <label>메모<textarea name="memo" rows="2"></textarea></label>
      <div class="form-actions"><button type="submit">계획 저장</button></div>
    </form>
  </template>
  <footer class="attribution" aria-labelledby="attribution-heading">
    <h2 id="attribution-heading">출처·크레딧</h2>
    <p><a href="https://www.kobis.or.kr/kobisopenapi/homepg/board/findServiceGuideList.do" target="_blank" rel="noopener noreferrer">영화진흥위원회 영화관입장권통합전산망 · 통합전산망 오픈 API 이용</a></p>
    <p><a href="https://developer.themoviedb.org/docs/faq" target="_blank" rel="noopener noreferrer"><img class="tmdb-logo" src="img/tmdb_logo_long.svg" alt="TMDB"></a></p>
    <p lang="en">This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    <p><a href="https://developers.kakao.com/docs/ko/local/dev-guide" target="_blank" rel="noopener noreferrer">카카오 로컬 API 이용</a></p>
  </footer>
</body>
</html>
