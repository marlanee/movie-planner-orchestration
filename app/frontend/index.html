<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대화 | 영화 플래너</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/api.js"></script>
  <script defer src="js/chat.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-bar">
      <span class="brand">영화 플래너</span>
      <nav aria-label="주 메뉴">
        <a href="index.html" aria-current="page">대화</a>
        <a href="plans.html">계획 관리</a>
        <a href="logs.html">실행 로그</a>
      </nav>
    </div>
  </header>
  <main class="page">
    <div class="page-heading">
      <h1>영화 관람 대화</h1>
      <button type="button" class="secondary" id="new-chat">새 대화</button>
    </div>
    <p id="key-warning" class="notice warning" role="status" hidden></p>
    <div class="chat-layout">
      <section class="panel" aria-labelledby="chat-heading">
        <h2 id="chat-heading">대화</h2>
        <div id="messages" class="messages" role="log" aria-label="대화 내역"></div>
        <p id="chat-guide" class="muted">관람 날짜, 지역, 가능한 시간대를 알려 주세요.</p>
        <form id="chat-form" class="chat-form">
          <label for="message">메시지</label>
          <textarea id="message" name="message" rows="3" maxlength="1000" required></textarea>
          <div class="form-actions">
            <button type="submit" id="send">전송</button>
            <span id="processing" class="processing" role="status" hidden><span class="spinner" aria-hidden="true"></span> 처리 중…</span>
          </div>
        </form>
        <section id="plan-candidates" class="plan-candidates" aria-labelledby="plan-candidates-heading" hidden>
          <h2 id="plan-candidates-heading">관람 계획 저장</h2>
          <div id="candidate-list" class="stack"></div>
        </section>
      </section>
      <aside class="panel trace-panel" aria-labelledby="trace-heading">
        <h2 id="trace-heading">실행 과정</h2>
        <div id="trace" aria-live="polite">
          <p class="muted">메시지를 전송하면 실행 과정이 표시됩니다.</p>
        </div>
      </aside>
    </div>
  </main>
  <footer class="attribution" aria-labelledby="attribution-heading">
    <h2 id="attribution-heading">출처·크레딧</h2>
    <p><a href="https://www.kobis.or.kr/kobisopenapi/homepg/board/findServiceGuideList.do" target="_blank" rel="noopener noreferrer">영화진흥위원회 영화관입장권통합전산망 · 통합전산망 오픈 API 이용</a></p>
    <p><a href="https://developer.themoviedb.org/docs/faq" target="_blank" rel="noopener noreferrer"><img class="tmdb-logo" src="img/tmdb_logo_long.svg" alt="TMDB"></a></p>
    <p lang="en">This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    <p><a href="https://developers.kakao.com/docs/ko/local/dev-guide" target="_blank" rel="noopener noreferrer">카카오 로컬 API 이용</a></p>
  </footer>
</body>
</html>
